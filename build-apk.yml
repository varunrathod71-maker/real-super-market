name: Build Real Supermarket APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          # No Gradle cache here. This avoids the missing-file error.

      - name: Find Android project or extract ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking repository for Android project..."

          find_settings() {
            find "$1" -type f \
              \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
              -not -path "*/.git/*" \
              -not -path "*/build/*" \
              -print -quit || true
          }

          SETTINGS_FILE="$(find_settings "$GITHUB_WORKSPACE")"

          # If only the ZIP was uploaded, extract it automatically.
          if [ -z "$SETTINGS_FILE" ]; then
            ZIP_FILE="$(find "$GITHUB_WORKSPACE" -type f -iname "*.zip" \
              -not -path "*/.git/*" -print -quit || true)"

            if [ -n "$ZIP_FILE" ]; then
              echo "Found project ZIP: $ZIP_FILE"

              EXTRACT_DIR="$GITHUB_WORKSPACE/.build-source"
              mkdir -p "$EXTRACT_DIR"
              unzip -q "$ZIP_FILE" -d "$EXTRACT_DIR"

              SETTINGS_FILE="$(find_settings "$EXTRACT_DIR")"
            fi
          fi

          # Stop with a useful message if the source is missing.
          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::Android Gradle project not found."
            echo "Upload the project ZIP or its extracted source files."
            echo "Repository files:"
            find "$GITHUB_WORKSPACE" -maxdepth 5 -type f | sort | head -200
            exit 1
          fi

          PROJECT_DIR="$(cd "$(dirname "$SETTINGS_FILE")" && pwd)"

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "::error::Found Gradle settings, but the app module is missing."
            echo "Project location: $PROJECT_DIR"
            find "$PROJECT_DIR" -maxdepth 4 -type f | sort | head -200
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project found: $PROJECT_DIR"

      - name: Install Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10.2'
          cache-disabled: true
          validate-wrappers: false

      - name: Build Debug APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle --version
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "::error::APK was not generated."
            exit 1
          fi

          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RealSupermarket-debug
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
