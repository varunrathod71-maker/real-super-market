name: Build Real Supermarket APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Find Android project
        shell: bash
        run: |
          set -euo pipefail

          find_settings() {
            find "$1" -type f \
              \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
              -not -path "*/.git/*" \
              -not -path "*/build/*" \
              -not -path "*/.gradle/*" \
              -print -quit || true
          }

          SETTINGS_FILE="$(find_settings "$GITHUB_WORKSPACE")"

          # Extract the project ZIP if the source files aren't extracted yet.
          if [ -z "$SETTINGS_FILE" ]; then
            ZIP_FILE="$(find "$GITHUB_WORKSPACE" -maxdepth 6 \
              -type f -iname "*.zip" \
              -not -path "*/.git/*" \
              -print -quit || true)"

            if [ -n "$ZIP_FILE" ]; then
              echo "Extracting: $ZIP_FILE"
              mkdir -p "$RUNNER_TEMP/project-source"
              unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/project-source"

              SETTINGS_FILE="$(find_settings "$RUNNER_TEMP/project-source")"
            fi
          fi

          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::Android project settings.gradle(.kts) not found."
            echo "Repository files:"
            find "$GITHUB_WORKSPACE" -maxdepth 5 -type f | sort | head -200
            exit 1
          fi

          PROJECT_DIR="$(cd "$(dirname "$SETTINGS_FILE")" && pwd)"

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "::error::The Android app module was not found."
            find "$PROJECT_DIR" -maxdepth 4 -type f | sort | head -200
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project found:"
          echo "$PROJECT_DIR"

      - name: Install Gradle 8.10.2
        shell: bash
        run: |
          set -euo pipefail

          VERSION="8.10.2"
          ZIP="$RUNNER_TEMP/gradle-${VERSION}-bin.zip"

          curl -fL --retry 3 \
            "https://services.gradle.org/distributions/gradle-${VERSION}-bin.zip" \
            -o "$ZIP"

          # Verify the official Gradle distribution checksum.
          echo "31c55713e40233a8303827ceb42ca48a47267a0ad4bab9177123121e71524c26  $ZIP" \
            | sha256sum --check

          unzip -q "$ZIP" -d "$RUNNER_TEMP"

          echo "$RUNNER_TEMP/gradle-${VERSION}/bin" >> "$GITHUB_PATH"

          "$RUNNER_TEMP/gradle-${VERSION}/bin/gradle" --version

      - name: Build Debug APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -Eeuo pipefail

          set +e
          gradle :app:assembleDebug --no-daemon --stacktrace \
            2>&1 | tee "$RUNNER_TEMP/gradle-build.log"

          BUILD_STATUS=${PIPESTATUS[0]}
          set -e

          if [ "$BUILD_STATUS" -ne 0 ]; then
            echo ""
            echo "========== ACTUAL BUILD ERROR =========="
            tail -n 160 "$RUNNER_TEMP/gradle-build.log"
            echo "========================================="
            exit "$BUILD_STATUS"
          fi

      - name: Verify APK
        shell: bash
        run: |
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "::error::APK file was not generated."
            exit 1
          fi

          echo "APK successfully generated:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RealSupermarket-debug
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
